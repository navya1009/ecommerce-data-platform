# ansible/inventory/dev.ini
# -----------------------------------------------------------------------------
# Inventory of EC2 hosts provisioned by Terraform.
# Replace the IPs with the actual values from `terraform output`.
# Or generate dynamically with: ansible-inventory --list
# -----------------------------------------------------------------------------

[airflow]
airflow-ec2 ansible_host=52.0.0.10

[spark]
spark-master-ec2 ansible_host=52.0.0.10

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/ecommerce-dev.pem
ansible_python_interpreter=/usr/bin/python3
environment=dev
project_name=ecommerce-data-platform

[airflow:vars]
app_dir=/opt/ecommerce-data-platform

[spark:vars]
spark_home=/opt/spark