# .github/workflows/ci.yml
# -----------------------------------------------------------------------------
# CI workflow: runs on every pull request to develop or main.
# Steps: lint, unit tests, integration tests, Docker smoke test.
#
# REQUIRED REPOSITORY SECRETS:
#   - None (this workflow does not need AWS or Airflow credentials)
# -----------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Cancel in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB 1: Lint + Unit Tests with coverage
  # ===========================================================================
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"                           # caches pip downloads [citation:2]
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pre-commit hooks (black, flake8, isort)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80                    # fails if coverage < 80% [citation:4]

      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json

  # ===========================================================================
  # JOB 2: Integration tests with Docker Compose
  # ===========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Start test databases via Docker Compose
        run: |
          docker compose up -d postgres mysql
          # Wait for healthchecks
          echo "Waiting for postgres..."
          for i in $(seq 1 30); do
            if docker compose ps postgres | grep -q "healthy"; then
              echo "Postgres is healthy"
              break
            fi
            sleep 2
          done
          echo "Waiting for mysql..."
          for i in $(seq 1 30); do
            if docker compose ps mysql | grep -q "healthy"; then
              echo "MySQL is healthy"
              break
            fi
            sleep 2
          done

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # JOB 3: Docker build + smoke test
  # ===========================================================================
  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ecommerce-data-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — import PySpark
        run: |
          docker run --rm ecommerce-data-platform:test \
            python -c "import pyspark; print('ok', pyspark.__version__)"

      - name: Smoke test — import pandas
        run: |
          docker run --rm ecommerce-data-platform:test \
            python -c "import pandas; print('ok', pandas.__version__)"

      - name: Smoke test — import boto3
        run: |
          docker run --rm ecommerce-data-platform:test \
            python -c "import boto3; print('ok', boto3.__version__)"

  # ===========================================================================
  # JOB 4: Post coverage comment on PR
  # ===========================================================================
  coverage-comment:
    name: Coverage Comment
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Post coverage comment
        uses: 5monkeys/cobertura-action@master
        with:
          path: coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 80
          skip_covered: false